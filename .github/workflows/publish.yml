name: "Publish"
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"

permissions:
  id-token: write  # Required for OIDC
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:

  pre-ci:
    name: Pre-CI (Extract Commit Message)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      commit-message: ${{ steps.get_commit_message.outputs.commit-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The commit message is passed through env, not interpolated into the script, so it can't inject shell code
      - id: get_commit_message
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$HEAD_COMMIT_MESSAGE" ]
          then
            echo "commit-message=$HEAD_COMMIT_MESSAGE" | head -n 1 >> "$GITHUB_OUTPUT"
          else
            commit_message=$(git log -1 --pretty=%B | head -n 1)
            echo "commit-message=$commit_message" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug commit message
        env:
          COMMIT_MESSAGE: ${{ steps.get_commit_message.outputs.commit-message }}
        run: |
          echo "Commit message: $COMMIT_MESSAGE"

  setup:
    name: Setup & Detect Changes
    needs: pre-ci
    runs-on: ubuntu-latest
    outputs:
      changed-types: ${{ steps.changed-types.outputs.changed }}
      changed-common-ethereum: ${{ steps.changed-common-ethereum.outputs.changed }}
      changed-node: ${{ steps.changed-node.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100 # Needed to detect changes by having commit history

      - uses: marceloprado/has-changed-path@v1
        id: changed-types
        with:
          paths: packages/types

      - uses: marceloprado/has-changed-path@v1
        id: changed-common-ethereum
        with:
          paths: packages/common-ethereum

      - uses: marceloprado/has-changed-path@v1
        id: changed-node
        with:
          paths: packages/node

  release:
    name: Release Publish
    needs: [pre-ci, setup]
    if: >
      !startsWith(github.event.head_commit.message, '[SKIP CI]')
      && startsWith(github.event.head_commit.message, '[release]')
      && github.repository == 'subquery/subql-ethereum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Update npm
        run: npm install -g npm@latest

      - run: yarn

      - name: build
        run: yarn build

      # Created after install and build, so their third-party code never sees a write token
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Publish to npm and github releases
      - name: Publish Types
        if: needs.setup.outputs.changed-types == 'true'
        uses: ./.github/actions/create-release
        with:
          package-path: packages/types
          repo-token: ${{ steps.app-token.outputs.token }}

      - name: Publish Common Ethereum
        if: needs.setup.outputs.changed-common-ethereum == 'true'
        uses: ./.github/actions/create-release
        with:
          package-path: packages/common-ethereum
          repo-token: ${{ steps.app-token.outputs.token }}

      - name: Publish Node
        if: needs.setup.outputs.changed-node == 'true'
        uses: ./.github/actions/create-release
        with:
          package-path: packages/node
          repo-token: ${{ steps.app-token.outputs.token }}

  prerelease:
    name: Prerelease Publish
    needs: [pre-ci, setup]
    if: >
      !startsWith(needs.pre-ci.outputs.commit-message, '[SKIP CI]')
      && !startsWith(needs.pre-ci.outputs.commit-message, '[release]')
      && github.repository == 'subquery/subql-ethereum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false # The push at the end uses its own short-lived token

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Update npm
        run: npm install -g npm@latest

      - run: yarn

      - name: build
        run: yarn build

      # Prerelease publish steps
      - name: Bump types & deploy
        if: needs.setup.outputs.changed-types == 'true'
        uses: ./.github/actions/create-prerelease
        with:
          package-path: packages/types

      - name: Bump common Ethereum & deploy
        if: needs.setup.outputs.changed-common-ethereum == 'true'
        uses: ./.github/actions/create-prerelease
        with:
          package-path: packages/common-ethereum

      - name: Bump node & deploy
        if: needs.setup.outputs.changed-node == 'true'
        uses: ./.github/actions/create-prerelease
        with:
          package-path: packages/node

      # Created after install, build and publish, so their third-party code never sees a write token
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit changes
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "[SKIP CI] Prerelease"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
